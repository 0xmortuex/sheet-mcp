[project]
name = "sheet-mcp"
version = "0.1.0"
description = "MCP server that reads and safely edits .xlsx files: formulas stay formulas, untouched cells stay identical, and any edit that would silently drop charts, pivots, macros or images is refused up front."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "openpyxl>=3.1.2",
    "defusedxml>=0.7.1",
]
keywords = ["mcp", "excel", "xlsx", "spreadsheet", "openpyxl", "formulas", "csv", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/sheet-mcp"

[project.scripts]
sheet-mcp = "sheet_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheet_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
# openpyxl and defusedxml ship no type information.
module = ["openpyxl.*", "defusedxml.*"]
ignore_missing_imports = true
